name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each step runs even if an earlier one failed, so one push reports every problem
      # rather than one at a time.
      - run: npm run typecheck
        if: '!cancelled()'

      - run: npm run lint
        if: '!cancelled()'

      - run: npm test
        if: '!cancelled()'

      - run: npm run build
        if: '!cancelled()'
        env:
          NEXT_PUBLIC_SITE_URL: https://inventory-management-system-one-zeta.vercel.app
